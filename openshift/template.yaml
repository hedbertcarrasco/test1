apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: react-fastapi-bff
  annotations:
    description: "React (built) + FastAPI BFF served from one container on OpenShift"
parameters:
  - name: NAME
    description: Base name for resources
    value: react-fastapi
  - name: NAMESPACE
    description: Target namespace/project
    value: default
  - name: GIT_URI
    description: Git repository URI containing this project
    required: true
  - name: GIT_REF
    description: Git reference (branch/tag)
    value: main

objects:
  # ImageStream
  - apiVersion: image.openshift.io/v1
    kind: ImageStream
    metadata:
      name: ${NAME}
      namespace: ${NAMESPACE}

  # BuildConfig (Docker strategy) building from repo root (Dockerfile at root)
  - apiVersion: build.openshift.io/v1
    kind: BuildConfig
    metadata:
      name: ${NAME}
      namespace: ${NAMESPACE}
    spec:
      source:
        type: Git
        git:
          uri: ${GIT_URI}
          ref: ${GIT_REF}
        contextDir: .
      strategy:
        type: Docker
        dockerStrategy: {}
      output:
        to:
          kind: ImageStreamTag
          name: ${NAME}:latest
      triggers:
        - type: GitHub
          github:
            secret: "dummy"
        - type: Generic
          generic:
            secret: "dummy"
        - type: ConfigChange
        - type: ImageChange

  # Deployment, Service, Route (single app)
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ${NAME}
      namespace: ${NAMESPACE}
      labels:
        app: ${NAME}
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: ${NAME}
      template:
        metadata:
          labels:
            app: ${NAME}
        spec:
          containers:
            - name: bff
              image: image-registry.openshift-image-registry.svc:5000/${NAMESPACE}/${NAME}:latest
              imagePullPolicy: IfNotPresent
              ports:
                - containerPort: 8000
                  name: http
              readinessProbe:
                httpGet:
                  path: /api/health
                  port: 8000
                initialDelaySeconds: 5
                periodSeconds: 10
              livenessProbe:
                httpGet:
                  path: /api/health
                  port: 8000
                initialDelaySeconds: 10
                periodSeconds: 10
  - apiVersion: v1
    kind: Service
    metadata:
      name: ${NAME}
      namespace: ${NAMESPACE}
      labels:
        app: ${NAME}
    spec:
      selector:
        app: ${NAME}
      ports:
        - name: http
          port: 8000
          targetPort: 8000
  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: ${NAME}
      namespace: ${NAMESPACE}
    spec:
      to:
        kind: Service
        name: ${NAME}
      port:
        targetPort: http
      tls:
        termination: edge
